service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    # Request "tốt" = trả lời thành công VÀ nhanh hơn 2000 ms.
    good_event: 'event == "response_sent" and latency_ms <= 2000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  rationale: >-
    Baseline đo trên log của tôi: P95 latency ≈ 151 ms, TTFT P95 = 50 ms, tỷ lệ lỗi 0%.
    Ngưỡng starter 3000 ms quá lỏng: sự cố rag_slow chỉ cộng thêm 2500 ms ở bước retrieval
    (tổng ≈ 2650 ms), nên vẫn "đạt" SLO 3000 ms dù người dùng chờ gấp ~17 lần baseline.
    Vì vậy tôi siết ngưỡng SLO xuống 2000 ms. Panel latency trong dashboard.yaml vẫn giữ
    P95 ≤ 3000 ms như contract của đề bài (không tự đổi contract).
  error_budget_calc: >-
    Error budget = 100% - 99.5% = 0.5% số request trong 28 ngày. Ví dụ 10.000 request/28 ngày
    cho phép tối đa 50 request lỗi hoặc chậm hơn 2000 ms. Tính theo thời gian: 28 ngày = 40.320 phút,
    0,5% ≈ 201,6 phút (≈ 3,4 giờ) "toàn bộ request đều xấu". Burn rate = tỷ lệ request xấu quan sát được / 0,5%;
    burn rate = 1 nghĩa là budget vừa đủ hết đúng ngày thứ 28, burn rate ≥ 10 nghĩa là hết trong ≤ 2,8 ngày.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
